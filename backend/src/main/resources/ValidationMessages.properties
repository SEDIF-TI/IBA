# =============================================================================
# Mensajes de Bean Validation en espanol.
# Se usan cuando una anotacion de un *Request no trae su propio mensaje
# (por ejemplo @Size(max = 80) sin message). Sin este archivo saldrian en ingles
# o en el idioma del servidor. Archivo en UTF-8.
# =============================================================================
jakarta.validation.constraints.NotNull.message=Este dato es obligatorio.
jakarta.validation.constraints.NotBlank.message=Este dato es obligatorio.
jakarta.validation.constraints.NotEmpty.message=Este dato es obligatorio.
jakarta.validation.constraints.Size.message=Debe tener entre {min} y {max} caracteres.
jakarta.validation.constraints.Min.message=Debe ser mayor o igual a {value}.
jakarta.validation.constraints.Max.message=Debe ser menor o igual a {value}.
jakarta.validation.constraints.Positive.message=Debe ser mayor que cero.
jakarta.validation.constraints.PositiveOrZero.message=No puede ser negativo.
jakarta.validation.constraints.Email.message=El correo no tiene un formato válido.
jakarta.validation.constraints.Pattern.message=El formato no es válido.
jakarta.validation.constraints.Past.message=La fecha debe ser anterior a hoy.
jakarta.validation.constraints.PastOrPresent.message=La fecha no puede ser posterior a hoy.
jakarta.validation.constraints.Future.message=La fecha debe ser posterior a hoy.
jakarta.validation.constraints.FutureOrPresent.message=La fecha no puede ser anterior a hoy.
