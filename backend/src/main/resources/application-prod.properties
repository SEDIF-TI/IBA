# =============================================================================
# SEA - Overrides del perfil 'prod'
# Se activa con SPRING_PROFILES_ACTIVE=prod (lo pone docker-compose.prod.yml).
# =============================================================================

# ---------------------------------------------------------------------------
# Detras del reverse proxy
# La IP real la resuelve IpRealFilter con app.proxies-confiables (ver
# application.properties). En el servidor, APP_PROXIES_CONFIABLES debe incluir la
# subred de la red de Nginx Proxy Manager; si falta, todos los clientes comparten
# el limite de peticiones (no se vuelve falseable, pero estorba). Ver deploy/README.md.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# JPA: en produccion no se registra SQL (ruido y fuga de datos en bitacora).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ---------------------------------------------------------------------------
# Cookies: en produccion el sitio va por HTTPS, la cookie del refresh token
# debe viajar solo por canal cifrado.
# ---------------------------------------------------------------------------
app.jwt.cookie-secure=true
app.jwt.cookie-same-site=Strict

# ---------------------------------------------------------------------------
# Bitacora: menos verbosa, sin SQL ni detalles internos.
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.mx.gob.sedif.sea=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF

# ---------------------------------------------------------------------------
# Errores: jamas exponer stack traces ni mensajes internos al cliente.
# El GlobalExceptionHandler responde el formato uniforme { success, message, data }.
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
