# =============================================================================
# SEA - Configuracion base (perfil de desarrollo)
# Los overrides de produccion viven en application-prod.properties
# =============================================================================

spring.application.name=sea

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080
# Todo el API cuelga de /api: el reverse proxy enruta ese prefijo al backend.
server.servlet.context-path=/api
# No revelar el servidor de aplicaciones en las cabeceras de respuesta.
server.error.include-stacktrace=never
server.error.include-message=never

# IP real del cliente detras de los proxies (Nginx del frontend y Nginx Proxy Manager).
# La resuelve IpRealFilter confiando SOLO en estas subredes (CIDR, separadas por coma).
# 172.31.250.128/25 es la mitad de la red interna de Docker donde viven los contenedores
# (docker-compose.yml); la puerta de enlace .1, por donde entra el trafico del equipo anfitrion,
# queda fuera a proposito. En produccion se agrega la subred de Nginx Proxy Manager.
# No se usa server.forward-headers-strategy: 'framework' cree el primer valor de X-Forwarded-For
# (lo escribe el cliente) y 'native' confia en todas las redes privadas.
server.forward-headers-strategy=none
app.proxies-confiables=${APP_PROXIES_CONFIABLES:127.0.0.1/32,::1/128,172.31.250.128/25}

# ---------------------------------------------------------------------------
# Base de datos
# En docker las variables las inyecta el compose. Los defaults de aqui apuntan
# al puerto 5433 del host, para poder correr el backend fuera del contenedor.
# ---------------------------------------------------------------------------
# Se resuelve en cascada:
#   1. SPRING_DATASOURCE_* -> las inyecta docker-compose dentro del contenedor.
#   2. POSTGRES_*          -> las que ya trae el .env, para correr el backend
#                             fuera de Docker (F5 o Spring Boot Dashboard).
# Asi una sola definicion en .env sirve para ambos modos, sin duplicar valores.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT_HOST:5433}/${POSTGRES_DB:sea}}
# La aplicacion usa una cuenta sin superusuario que solo lee y escribe datos (DML);
# Flyway migra con la cuenta duena del esquema. Ver deploy/db/init/01-roles.sh.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_APP_USER:sea_app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_APP_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# REGLA DURA: Hibernate NUNCA genera ni modifica el esquema. Solo valida que
# las entidades correspondan con lo que crearon las migraciones Flyway.
# Si una entidad no cuadra con la tabla, la aplicacion no arranca. Es a proposito.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.properties.hibernate.default_schema=public
# Lotes: reduce el numero de viajes a la BD en altas masivas (jornadas).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Flyway: unica fuente de verdad del esquema
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${SPRING_FLYWAY_USER:${DB_OWNER_USER:sea_owner}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${DB_OWNER_PASSWORD:}}
spring.flyway.baseline-on-migrate=false
# Nunca reescribir una migracion ya aplicada: Flyway aborta si cambia su hash.
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ---------------------------------------------------------------------------
# Seguridad / JWT
# El secreto no tiene default: si falta, JwtSecretValidator aborta el arranque.
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration=${APP_JWT_ACCESS_EXPIRATION:3600000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=sea-dif-puebla
# La cookie del refresh token no se marca Secure en dev (http://localhost).
app.jwt.cookie-secure=false
app.jwt.cookie-same-site=Lax

# Bloqueo por intentos fallidos de login
app.seguridad.max-intentos-fallidos=5
app.seguridad.minutos-bloqueo=15

# CORS restrictivo: lista blanca explicita, sin comodines.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}

# Rate limiting (peticiones por minuto y por IP)
app.rate-limit.login=5
# Refresco aparte del login: con el token en memoria, cada recarga del panel hace una renovacion,
# y una oficina entera puede salir a internet con la misma IP. 30 por minuto se agotaba en la
# revision con navegador; un token de renovacion valido no se puede adivinar, asi que este limite
# solo frena abusos y puede ser holgado.
app.rate-limit.refresco=120
app.rate-limit.publico=20
app.rate-limit.consulta=30
# Carga de documentos desde el portal: mas baja, cada peticion trae un archivo.
app.rate-limit.documento=10

# ---------------------------------------------------------------------------
# Usuario administrativo inicial (semilla)
# Sin valor por defecto conocido: si no se define, no se crea usuario alguno.
# ---------------------------------------------------------------------------
app.admin.usuario=${APP_ADMIN_USUARIO:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.correo=${APP_ADMIN_CORREO:}

# ---------------------------------------------------------------------------
# Almacenamiento de documentos personales
# Ruta FUERA del document root. Los archivos nunca se sirven por URL directa.
# ---------------------------------------------------------------------------
app.storage.path=${APP_STORAGE_PATH:./storage}
app.storage.max-file-mb=${APP_STORAGE_MAX_FILE_MB:10}

# Limites de subida de Spring, alineados con el maximo por archivo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ---------------------------------------------------------------------------
# Correo: en este sprint el envio real esta DESHABILITADO.
# La implementacion activa es un stub que registra en bitacora.
# ---------------------------------------------------------------------------
# Direccion que se inserta en los avisos para que la persona consulte su tramite.
app.portal.url-consulta=${APP_PORTAL_URL_CONSULTA:http://localhost/consulta}
app.verificacion.url=${APP_VERIFICACION_URL:http://localhost/verificar}

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}
spring.mail.host=${APP_MAIL_HOST:localhost}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Actuator: solo health, y sin detalles al publico.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
# El health de correo intenta abrir conexion SMTP en cada sondeo. En este
# sprint el envio es un stub, y sin servidor real dejaria el estado en DOWN:
# el healthcheck del compose reiniciaria el contenedor en ciclo.
management.health.mail.enabled=false

# ---------------------------------------------------------------------------
# Formato de fechas y zona horaria
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/Mexico_City
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Bitacora (SLF4J). Cero System.out.println en el codigo.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.mx.gob.sedif.sea=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
