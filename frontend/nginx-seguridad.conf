# =============================================================================
# Encabezados de proteccion del navegador. Se incluye en el bloque server y en
# cada location que agrega encabezados propios: en Nginx, un add_header dentro de
# un location descarta los heredados, y asi ninguno se queda sin ellos.
# =============================================================================

# Impide que el sitio se cargue dentro de un marco ajeno (secuestro de clics).
add_header X-Frame-Options "DENY" always;
# Obliga a respetar el tipo declarado en lugar de adivinarlo.
add_header X-Content-Type-Options "nosniff" always;
# Al salir a otro sitio solo se envia el dominio, nunca la ruta completa.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El sistema no usa camara, microfono, ubicacion, pagos ni USB del navegador.
# (Subir una foto desde el celular abre el selector nativo y no necesita camera.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Todo sale del propio dominio: no hay fuentes, scripts ni mapas de terceros.
# 'unsafe-inline' solo en estilos, porque la biblioteca de componentes (MUI/Emotion)
# los inserta al vuelo; los scripts no lo llevan.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
