# =============================================================================
# Nginx interno del contenedor del frontend.
# =============================================================================

# Rutas temporales que el usuario sin privilegios si puede escribir.
client_body_temp_path /tmp/nginx/client_body;
proxy_temp_path       /tmp/nginx/proxy;
fastcgi_temp_path     /tmp/nginx/fastcgi;
uwsgi_temp_path       /tmp/nginx/uwsgi;
scgi_temp_path        /tmp/nginx/scgi;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de Nginx.
    server_tokens off;

    # ---- Encabezados de proteccion (ver nginx-seguridad.conf) ----
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # OJO: en nginx, un add_header dentro de un bloque location DESCARTA todos
    # los heredados del nivel superior. Por eso cada bloque que agrega uno
    # vuelve a incluir el archivo de encabezados de proteccion.

    # Los archivos con huella en el nombre no cambian nunca: se pueden guardar
    # indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    # El index nunca se guarda en cache: es lo que apunta a la version nueva
    # tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/seguridad.conf;
    }

    # Todo lo que va a /api se reenvia al backend, que vive en la red interna.
    # Asi el navegador ve un solo origen y no hace falta CORS ni conocer el
    # puerto del backend: es lo mismo que hara el proxy inverso en el servidor.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Host con puerto ($http_host y no $host): Spring compara el Origin del navegador con
        # este Host para saber si la peticion es del mismo origen. Sin el puerto, abrir el
        # sistema en un puerto distinto del 80 (por ejemplo localhost:8088) daba 403 de CORS.
        proxy_set_header Host $http_host;
        # Sin estas cabeceras el backend veria la IP del contenedor y no la del
        # cliente, con lo que el limite de peticiones dejaria de servir.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La descarga de un certificado con muchas credenciales puede tardar.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;

        # Los PDF se envian conforme se generan, sin acumularlos en memoria.
        proxy_buffering off;

        client_max_body_size 30M;
    }

    # La aplicacion resuelve sus propias rutas: cualquier direccion que no
    # corresponda a un archivo devuelve el index para que React enrute.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos: fuera.
    location ~ /\. {
        deny all;
    }
}
