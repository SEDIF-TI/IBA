# =============================================================================
# Nginx interno del contenedor del frontend.
# =============================================================================

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de Nginx.
    server_tokens off;

    # ---- Encabezados de proteccion ----
    # Impide que el sitio se cargue dentro de un marco ajeno.
    add_header X-Frame-Options "DENY" always;
    # Obliga a respetar el tipo declarado en lugar de adivinarlo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El sistema no carga nada de terceros; 'unsafe-inline' en estilos es
    # necesario porque la biblioteca de componentes los inserta al vuelo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los archivos con huella en el nombre no cambian nunca: se pueden guardar
    # indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se guarda en cache: es lo que apunta a la version nueva
    # tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # La aplicacion resuelve sus propias rutas: cualquier direccion que no
    # corresponda a un archivo devuelve el index para que React enrute.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos: fuera.
    location ~ /\. {
        deny all;
    }
}
