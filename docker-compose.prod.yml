# =============================================================================
# Override para SERVIDOR.
# No publica puertos: el acceso entra por el reverse proxy (NPM), que vive en
# su propia red externa y enruta por nombre de servicio.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =============================================================================

services:

  db:
    # Sin puertos publicados: la BD solo es alcanzable desde la red interna.
    networks:
      - sea_interna

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Subredes de los proxies de confianza (CIDR): la red interna del proyecto
      # y la de Nginx Proxy Manager. Ver deploy/README.md, "IP real del cliente".
      APP_PROXIES_CONFIABLES: ${APP_PROXIES_CONFIABLES}
    networks:
      - sea_interna
      - proxy

  frontend:
    build:
      args:
        # En prod el frontend y el backend cuelgan del mismo dominio:
        # el proxy enruta /api al backend. Ruta relativa, sin host.
        VITE_API_URL: /api
    networks:
      - sea_interna
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_default}
